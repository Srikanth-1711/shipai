name: Golden Projects Regression

on:
  push:
  pull_request:

jobs:
  golden:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run golden projects tests
        env:
          SHIPAI_BOOTSTRAP_ONLY: "1"
        run: |
          cd backend
          python -m pytest tests/test_golden_projects.py -q --tb=short

